org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 26.x: Gradle itself on JDK 25 (CI removes this line and sets up JDK 25)
org.gradle.java.home=/Users/vladeezy/.gradle/jdks/eclipse_adoptium-25-aarch64-os_x.2/jdk-25.0.4.1+1/Contents/Home

# Project
mod_id=spartanweaponry
mod_name=Spartan Weaponry
license=LGPL-3.0-only
mod_version=3.2.1.2
group=com.oblivioussp.spartanweaponry
mod_authors=ObliviousSpartan
mod_credits=xwerffx for the weapon ideas and most of the art. Translators: alexvirgo13 (Spanish), Samlegamer (French), MrMikeForDev (Chinese) and SplashedTomato (Russian). Port to NeoForge and Fabric: Vladeezyy
mod_description=Weapons Galore! A whole new arsenal of weaponry made for Minecraft.
java_version=25

# Common
minecraft_version=26.2
minecraft_version_range=[26.2]
# NeoForm (vanilla Minecraft for the common project); 26.x has no obfuscation and no Parchment
neo_form_version=26.2-2

# NeoForge
neo_version=26.2.0.93
# The oldest NeoForge the jar runs on
neo_version_range=[26.2.0.93,)

# Fabric
fabric_version=0.161.0+26.2
fabric_loader_version=0.19.5
# NeoForge's config API on Fabric (Forge Config API Port by Fuzs); the common project compiles against its API jar
forgeconfigapiport_version=26.2.1
team_reborn_energy_version=5.0.0

# Optional integrations (compile against them; the jar does not depend on them)
jei_version=30.47.0.238
jei_fabric_version=30.47.0.238
curios_version=16.0.0+26.2
shoulder_surfing_version=26.2-5.2.0
shoulder_surfing_version_range=[26.2-5.2.0,)

# Compatibility runs (-Pwith_compat; -Pwith_ss4 for Shoulder Surfing 4.x instead of 5.x); none is a dependency
compat_sodium=mc26.2-0.9.2-neoforge
compat_iris=1.11.4+26.2-neoforge
compat_lithium=mc26.2-0.25.3-neoforge
compat_ferritecore=9.0.0-neoforge
compat_jade=26.2.10+neoforge
# Fabric compatibility runs (-Pwith_compat on :fabric:runScene / runStress; Modrinth version ids where a number is
# shared with other loaders; JEED 2.3.3: 2.3.4+ for Fabric is built with Loom 1.17, which Loom 1.13 cannot read)
compat_fabric_sodium=mc26.2-0.9.2-fabric
compat_fabric_iris=1.11.4+26.2-fabric
compat_fabric_lithium=mc26.2-0.25.3-fabric
compat_fabric_ferritecore=9.0.0-fabric
compat_fabric_jade=26.2.11+fabric
