org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Project
mod_id=spartanweaponry
mod_name=Spartan Weaponry
license=LGPL-3.0-only
mod_version=3.2.1.2
group=com.oblivioussp.spartanweaponry
mod_authors=ObliviousSpartan
mod_credits=xwerffx for the weapon ideas and most of the art. Translators: alexvirgo13 (Spanish), Samlegamer (French), MrMikeForDev (Chinese) and SplashedTomato (Russian). Port to NeoForge and Fabric: Vladeezyy
mod_description=Weapons Galore! A whole new arsenal of weaponry made for Minecraft.
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# NeoForm (vanilla Minecraft for the common project) and ParchmentMC
neo_form_version=1.21.1-20240808.144430
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# NeoForge
neo_version=21.1.259
# The oldest NeoForge the jar runs on
neo_version_range=[21.1.197,)

# Fabric
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.16.14
# NeoForge's config API on Fabric (Forge Config API Port by Fuzs); the common project compiles against its API jar
forgeconfigapiport_version=21.1.6
team_reborn_energy_version=4.1.0

# Optional integrations (compile against them; the jar does not depend on them)
jei_version=19.64.0.454
# JEI for Fabric built with Loom 1.13 (19.57+ needs Loom 1.18)
jei_fabric_version=19.56.0.441
emi_version=1.1.24+1.21.1
curios_version=9.5.1+1.21.1
shoulder_surfing_version=1.21.1-5.2.0
shoulder_surfing_version_range=[1.21.1-4.3.1,)

# Compatibility runs (-Pwith_compat; -Pwith_ss4 for Shoulder Surfing 4.x instead of 5.x); none is a dependency
compat_sodium=mc1.21.1-0.6.13-neoforge
compat_iris=1.8.12+1.21.1-neoforge
compat_lithium=mc1.21.1-0.15.4-neoforge
compat_ferritecore=7.0.3-neoforge
compat_modernfix=5.27.26+mc1.21.1
compat_jade=15.10.6+neoforge
compat_jeed=3dTukOBl
compat_shoulder_surfing_4=1.21.1-4.5.1
# Fabric compatibility runs (-Pwith_compat on :fabric:runScene / runStress; Modrinth version ids where a number is
# shared with other loaders; JEED 2.3.3: 2.3.4+ for Fabric is built with Loom 1.17, which Loom 1.13 cannot read)
compat_fabric_sodium=mc1.21.1-0.6.13-fabric
compat_fabric_iris=1.8.8+1.21.1-fabric
compat_fabric_lithium=mc1.21.1-0.15.4-fabric
compat_fabric_ferritecore=7.0.3-fabric
compat_fabric_modernfix=NnNX8LBn
compat_fabric_jade=A416FkrB
compat_fabric_emi=1.1.24+1.21.1+fabric
compat_fabric_jeed=yfyTcGmb
