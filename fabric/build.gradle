plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
    maven { url = 'https://maven.blamejared.com/' } // JEI
}

loom {
    accessWidenerPath = file('src/main/resources/spartanweaponry.accesswidener')
    // One refmap for the common mixins and the Fabric ones (common/…/spartanweaponry.mixins.json names it)
    mixin {
        defaultRefmapName = 'spartanweaponry.mixins.refmap.json'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // NeoForge's config API (the config of the NeoForge version) on Fabric; a required mod
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    // Optional integrations
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_fabric_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_fabric_version}"
    compileOnly "maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_version}+fabric"
    // Mod Menu (opens the config screen) in the dev runs only
    localRuntime "maven.modrinth:modmenu:21.0.0"
    // Popular client / performance mods and the optional integrations for compatibility runs (-Pwith_compat)
    if (project.hasProperty('with_compat')) {
        localRuntime "maven.modrinth:sodium:${compat_fabric_sodium}"
        localRuntime "maven.modrinth:iris:${compat_fabric_iris}"
        // Iris' own libraries: Loom does not load the jars inside dev mods (Iris 1.8.8 for Fabric)
        localRuntime 'org.anarres:jcpp:1.4.14'
        localRuntime 'org.antlr:antlr4-runtime:4.13.1'
        localRuntime 'io.github.douira:glsl-transformer:3.0.0-pre3'
        localRuntime "maven.modrinth:lithium:${compat_fabric_lithium}"
        localRuntime "maven.modrinth:ferrite-core:${compat_fabric_ferritecore}"
        localRuntime "maven.modrinth:jade:${compat_fabric_jade}"
        localRuntime "maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_version}+fabric"
    }
    if (project.hasProperty('with_jei')) {
        localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_fabric_version}"
        localRuntime "maven.modrinth:mezzconfig:0.5.6"
    }
}

loom {
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        scene {
            client()
            name 'Scene'
            vmArg '-Dspartanweaponry.scene=true'
            vmArg "-Dspartanweaponry.scene.lang=${project.findProperty('scene_lang') ?: 'en_us'}"
            runDir('run')
        }
        stress {
            client()
            name 'Stress'
            vmArg '-Dspartanweaponry.stress=true'
            runDir('run')
        }
    }
}

tasks.named('jar', Jar).configure {
    exclude 'com/oblivioussp/spartanweaponry/port/**'
}

// The release jar on a real Fabric server
configurations {
    productionMods { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionMods "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
}

// Production runs (tools/prodtest.sh): Minecraft as players have it (26.x: no obfuscation, so no names to remap). The
// release jar on a real Fabric server; the scenes on a production client from a jar that is the release jar plus port/
var scenesJar = tasks.register('scenesJar', Jar) {
    from sourceSets.main.output
    archiveClassifier = 'scenes'
}
['Scene': 'spartanweaponry.scene', 'Stress': 'spartanweaponry.stress'].each { name, property ->
    tasks.register("prod${name}", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
        // setFrom: Loom adds the jar by default, and of two jars with one mod id Fabric loads either
        mods.setFrom(scenesJar, configurations.productionMods)
        jvmArgs.add("-D${property}=true")
        runDir = file('run-prod')
    }
}
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    mods.from(tasks.named('jar'), configurations.productionMods)
    runDir = file('run-prod-server')
}
