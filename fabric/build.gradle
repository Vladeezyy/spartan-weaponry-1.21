plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
    maven { url = 'https://maven.blamejared.com/' } // JEI
}

loom {
    accessWidenerPath = file('src/main/resources/spartanweaponry.accesswidener')
    // One refmap for the common mixins and the Fabric ones (common/…/spartanweaponry.mixins.json names it)
    mixin {
        defaultRefmapName = 'spartanweaponry.mixins.refmap.json'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // NeoForge's config API (the config of the NeoForge version) on Fabric; a required mod
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    // Optional integrations
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_fabric_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_fabric_version}"
    modCompileOnly "maven.modrinth:emi:${emi_version}+fabric"
    modCompileOnly "maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_version}+fabric"
    // Mod Menu (opens the config screen) in the dev runs only
    modLocalRuntime "maven.modrinth:modmenu:11.0.3"
    // Popular client / performance mods and the optional integrations for compatibility runs (-Pwith_compat)
    if (project.hasProperty('with_compat')) {
        modLocalRuntime "maven.modrinth:sodium:${compat_fabric_sodium}"
        modLocalRuntime "maven.modrinth:iris:${compat_fabric_iris}"
        // Iris' own libraries: Loom does not load the jars inside dev mods (Iris 1.8.8 for Fabric)
        modLocalRuntime 'org.anarres:jcpp:1.4.14'
        modLocalRuntime 'io.github.douira:glsl-transformer:2.0.1'
        modLocalRuntime "maven.modrinth:lithium:${compat_fabric_lithium}"
        modLocalRuntime "maven.modrinth:ferrite-core:${compat_fabric_ferritecore}"
        modLocalRuntime "maven.modrinth:modernfix:${compat_fabric_modernfix}"
        modLocalRuntime "maven.modrinth:jade:${compat_fabric_jade}"
        modLocalRuntime "maven.modrinth:emi:${compat_fabric_emi}"
        modLocalRuntime "maven.modrinth:just-enough-effect-descriptions-jeed:${compat_fabric_jeed}"
        modLocalRuntime "maven.modrinth:shoulder-surfing-reloaded:${project.hasProperty('with_ss4') ? compat_shoulder_surfing_4 : shoulder_surfing_version}+fabric"
    }
    if (project.hasProperty('with_jei')) {
        modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_fabric_version}"
        modLocalRuntime "maven.modrinth:mezzconfig:0.5.6"
    }
}

loom {
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        scene {
            client()
            name 'Scene'
            vmArg '-Dspartanweaponry.scene=true'
            vmArg "-Dspartanweaponry.scene.lang=${project.findProperty('scene_lang') ?: 'en_us'}"
            runDir('run')
        }
        stress {
            client()
            name 'Stress'
            vmArg '-Dspartanweaponry.stress=true'
            runDir('run')
        }
    }
}

tasks.named('jar', Jar).configure {
    exclude 'com/oblivioussp/spartanweaponry/port/**'
}

// The release jar on a real (intermediary-mapped) Fabric server
configurations {
    productionMods { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionMods "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
}

// Production runs (tools/prodtest.sh): Minecraft with intermediary names, as players have it. The release jar on a
// real Fabric server; the scenes on a production client from a jar that is the release jar plus port/ (so every
// mixin is checked against the intermediary names)
var scenesJar = tasks.register('scenesJar', Jar) {
    from sourceSets.main.output
    archiveClassifier = 'scenes-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
var remapScenesJar = tasks.register('remapScenesJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = scenesJar.flatMap { it.archiveFile }
    archiveClassifier = 'scenes'
}
['Scene': 'spartanweaponry.scene', 'Stress': 'spartanweaponry.stress'].each { name, property ->
    tasks.register("prod${name}", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
        mods.from(remapScenesJar, configurations.productionMods)
        jvmArgs.add("-D${property}=true")
        runDir = file('run-prod')
    }
}
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    mods.from(tasks.named('remapJar'), configurations.productionMods)
    runDir = file('run-prod-server')
}
