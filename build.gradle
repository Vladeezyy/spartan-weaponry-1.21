plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'SpartanWeaponry-neoforge'
}

repositories {
    maven { url = 'https://maven.blamejared.com/' } // JEI
    maven { url = 'https://maven.theillusivec4.top/' } // Curios
    maven {
        url = 'https://api.modrinth.com/maven' // EMI, Shoulder Surfing
        content { includeGroup 'maven.modrinth' }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:emi:${emi_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    compileOnly "maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_version}"
    // Dev runs: JEI and Curios (-Pno_compat_mods to run without them)
    if (!project.hasProperty('no_compat_mods')) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version             : minecraft_version,
            minecraft_version_range       : minecraft_version_range,
            neo_version_range             : neo_version_range,
            shoulder_surfing_version_range: shoulder_surfing_version_range,
            mod_id                        : mod_id,
            mod_name                      : mod_name,
            mod_license                   : mod_license,
            mod_version                   : mod_version,
            mod_authors                   : mod_authors,
            mod_credits                   : mod_credits,
            mod_description               : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { 'LICENSE_spartanweaponry' } }
    from('licenses') { into 'licenses/spartanweaponry' }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
